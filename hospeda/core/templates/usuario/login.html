{% extends "base.html" %}
{% load static %}
{% block conteudo %}
<main>
    <h2>Entrar</h2>
    {% if form.errors %}<p>Usuário ou senha inválidos. Tente novamente.</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <div><label for="id_username">Usuário:</label>{{ form.username }}</div>
        <div><label for="id_password">Senha:</label>{{ form.password }}</div>
        <button type="submit">Entrar</button>
    </form>
    <p>Ainda não tem conta? <a href="{% url 'cadastrar_hospede' %}">Cadastre-se</a>.</p>
</main>
{% endblock %}
